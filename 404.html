<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="roza-icon-192.png">
<link rel="apple-touch-icon" href="roza-icon.png">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16202a" media="(prefers-color-scheme: dark)">
<title>Opening… – Roza Gift Corner &amp; Electric</title>
<script>
/* GitHub Pages serves this file for any address that has no real file, e.g.
   https://<domain>/<folder>/live-chat
   For the Live Chat address we hand over to index.html (same folder). index.html then shows the clean
   address again (no # or ?) and opens the chat. Nothing is put in the address bar except the clean path. */
(function () {
  var p = location.pathname, m = p.match(/^(.*\/)live-chat\/?$/i);
  if (m) {
    try { sessionStorage.setItem('rgce_route', 'live-chat'); } catch (e) {}
    location.replace(m[1]);                       // e.g. /due-checker/
    return;
  }
  /* any other unknown address: the page below is shown, with a link to the home page */
  var seg = p.split('/').filter(Boolean)[0], home = (/github\.io$/i.test(location.hostname) && seg) ? '/' + seg + '/' : '/';
  var logo = home + 'roza-icon-192.png', full = home + 'roza-logo.png';                   // logo file sits in the same GitHub folder as this page
  document.querySelectorAll('link[rel=icon],link[rel=apple-touch-icon]').forEach(function (l) { l.setAttribute('href', logo); });
  document.addEventListener('DOMContentLoaded', function () { var im = document.querySelector('.blogo'); if (im) im.setAttribute('src', full); });
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('nf').hidden = false;
    document.getElementById('home').setAttribute('href', home);
    document.title = 'Page not found – Roza Gift Corner & Electric';
  });
})();
</script>
<style>
  :root{--ink:#14212e;--muted:#5d6b78;--bg:#f1f4f7;--paper:#fff;--line:#d9e0e7;--navy:#1f4e79;--navy-d:#0f2d4a}
  @media (prefers-color-scheme:dark){:root{--ink:#e8eef4;--muted:#9aa9b7;--bg:#0e151c;--paper:#16202a;--line:#2b3947;--navy:#6fa8dc}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Bengali",Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  .box{max-width:420px;width:100%;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 22px}
  .logo{overflow:hidden;width:56px;height:56px;border-radius:12px;background:#fff;color:#0f2d4a;border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;margin:0 auto 14px}
  .blogo{display:block;height:64px;width:auto;max-width:100%;object-fit:contain;margin:0 auto 14px;background:#fff;border-radius:10px}
  @media (prefers-color-scheme:dark){.blogo{box-sizing:content-box;height:52px;padding:6px 12px;max-width:calc(100% - 24px)}}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 18px;color:var(--muted)}
  a.btn{display:inline-block;background:var(--navy-d);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:12px 22px}
  @media (prefers-color-scheme:dark){a.btn{background:var(--navy);color:#0e151c}}
</style>
</head>
<body>
  <div class="box">
    <img class="blogo" src="roza-logo.png" alt="Roza Gift Corner &amp; Electric" decoding="async" onerror="this.style.display='none';document.getElementById('fb').hidden=false">
    <div class="logo" id="fb" hidden aria-hidden="true">RGCE</div>
    <div id="wait"><p>Opening…</p></div>
    <div id="nf" hidden>
      <h1>Page not found</h1>
      <p>This address does not exist. Please go to the home page.</p>
      <a class="btn" id="home" href="/">Go to home page</a>
    </div>
  </div>
  <noscript><p style="text-align:center">Please enable JavaScript, or <a href="./">open the home page</a>.</p></noscript>
</body>
</html>
