    tx.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    $('sd').addEventListener('click', send);
    S.justSent = true; drawMsgs();
  }
  function viewEnded() {
    S.view = 'ended';
    pn.innerHTML = head() + '<div class="bdy"><div class="mt">' + t('ended') + '</div><button class="go" id="ag" type="button">' + t('again') + '</button></div>' + pw();
    $('ag').addEventListener('click', function () { viewOnboard(); });
  }
  function drawMsgs() {
    var b = $('bdy'); if (!b) return;
    var near = b.scrollHeight - b.scrollTop - b.clientHeight < 80;
    b.textContent = '';
    if (!S.msgs.length) { var e = document.createElement('div'); e.className = 'mt'; e.textContent = t('empty'); b.appendChild(e); }
    S.msgs.forEach(function (m) {
      var d = document.createElement('div'); d.className = 'm' + (m.senderType === 'customer' ? ' c' : '');
      d.appendChild(document.createTextNode(m.text));
      var s = document.createElement('small'), when = m.ts ? new Date(m.ts) : null;
      s.textContent = (when ? when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '') + (m.senderType === 'customer' ? '  ' + (m.readStatus === 'read' ? '\u2713\u2713 ' + t('read') : '\u2713 ' + t('sent')) : '');
      d.appendChild(s); b.appendChild(d);
    });
    if (near || S.justSent) { b.scrollTop = b.scrollHeight; S.justSent = false; }
  }

  /* ---------- actions ---------- */
  async function onboard() {
    var nm = $('nm').value.replace(/\s+/g, ' ').trim(), ph = normPhone($('ph').value), er = $('er'), btn = $('st');
    if (nm.length < 2) { er.textContent = t('nameBad'); return; }
    if (!ph) { er.textContent = t('phoneBad'); return; }
    er.textContent = ''; btn.disabled = true; btn.textContent = t('loading');
    try {
      var fs = await sdk(), id = newId(), now = Date.now();
      await fs.setDoc(fs.doc(S.db, 'chats', id), {
        customerName: nm, contactNumber: ph, createdAt: fs.serverTimestamp(), lastActivity: fs.serverTimestamp(),
        deletionScheduledAt: fs.Timestamp.fromMillis(now + RETAIN_MS), extensionCount: 0,
        unreadAdmin: 0, unreadCustomer: 0, lastMessage: '', lastSender: '', status: 'open'
      });
      S.session = { chatId: id, name: nm, phone: ph }; saveSession(S.session);
      S.msgs = []; S.chat = null; await listen(); viewChat(); var tx = $('tx'); if (tx) tx.focus();
    } catch (e) { console.warn('chat start', e); er.textContent = t('err'); btn.disabled = false; btn.textContent = t('start'); }
  }
  async function send() {
    var tx = $('tx'); if (!tx || !S.session) return;
    var text = tx.value.trim().slice(0, MAXLEN); if (!text) return;
    tx.value = ''; tx.style.height = 'auto'; S.justSent = true;
    try {
      var fs = await sdk(), id = S.session.chatId, ref = fs.doc(fs.collection(S.db, 'chats', id, 'messages')), b = fs.writeBatch(S.db);
      b.set(ref, { messageId: ref.id, senderId: id, senderType: 'customer', text: text, timestamp: fs.serverTimestamp(), readStatus: 'sent' });
      b.update(fs.doc(S.db, 'chats', id), { lastActivity: fs.serverTimestamp(), lastMessage: text.slice(0, 120), lastSender: 'customer', unreadAdmin: fs.increment(1) });
      await b.commit();
    } catch (e) { console.warn('chat send', e); tx.value = text; var er = document.createElement('div'); er.className = 'mt'; er.textContent = t('err'); var b2 = $('bdy'); if (b2) b2.appendChild(er); }
  }
  async function markRead() {
    if (S.marking || !S.open || S.view !== 'chat' || !S.session || document.hidden) return;
    var unread = S.msgs.filter(function (m) { return m.senderType === 'admin' && m.readStatus !== 'read'; });
    if (!unread.length && !(S.chat && S.chat.unreadCustomer > 0)) return;
    S.marking = true;
    try {
      var fs = S.fs, id = S.session.chatId, b = fs.writeBatch(S.db);
      unread.slice(0, 400).forEach(function (m) { b.update(fs.doc(S.db, 'chats', id, 'messages', m.id), { readStatus: 'read' }); });
      b.update(fs.doc(S.db, 'chats', id), { unreadCustomer: 0 });
      await b.commit();
    } catch (e) { console.warn('mark read', e); } finally { S.marking = false; }
  }
  function stopListen() { if (S.unsubC) S.unsubC(); if (S.unsubM) S.unsubM(); S.unsubC = S.unsubM = null; }
  async function listen() {
    stopListen(); if (!S.session) return;
    var fs = await sdk(), id = S.session.chatId;
    S.unsubC = fs.onSnapshot(fs.doc(S.db, 'chats', id), function (snap) {
      if (!snap.exists()) {                                         // deleted by the shop (retention / manual purge)
        if (snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
        stopListen(); clearSession(); S.session = null; S.chat = null; S.msgs = [];
        if (S.open) viewEnded(); badge(); return;
      }
      S.chat = snap.data(); badge(); markRead();
    }, function (e) { console.warn('chat doc', e); });
    S.unsubM = fs.onSnapshot(fs.query(fs.collection(S.db, 'chats', id, 'messages'), fs.orderBy('timestamp', 'asc'), fs.limit(300)), function (qs) {
      S.msgs = qs.docs.map(function (d) { var x = d.data({ serverTimestamps: 'estimate' }); x.id = d.id; x.ts = x.timestamp && x.timestamp.toMillis ? x.timestamp.toMillis() : null; return x; });
      if (S.view === 'chat') drawMsgs(); markRead();
    }, function (e) { console.warn('chat msgs', e); });
  }

  /* ---------- open / close (+ address bar) ---------- */
  function mobile() { return window.matchMedia && window.matchMedia('(max-width:600px)').matches; }
  var IC_EXP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
  var IC_COL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>';
  function modeLabel() { return S.mode === 'side' ? t('collapse') : t('expand'); }
  function modeIcon() { return S.mode === 'side' ? IC_COL : IC_EXP; }
  function applyMode() {
    w.classList.toggle('side', S.mode === 'side');
    var b = pn.querySelector('[data-m]');
    if (b) { b.innerHTML = modeIcon(); b.setAttribute('aria-label', modeLabel()); b.title = modeLabel(); }
    fit();
  }
  function setMode(m) { S.mode = m; applyMode(); }
  var WKEY = 'rgce_chat_w', MINW = 300, DEFW = 380;
  try { S.w = parseInt(localStorage.getItem(WKEY), 10) || DEFW; } catch (e) { S.w = DEFW; }
  function maxW() { return Math.max(MINW, Math.min(1000, window.innerWidth - 120)); }
  function clampW(x) { return Math.max(MINW, Math.min(maxW(), x)); }
  function saveW() { try { localStorage.setItem(WKEY, String(Math.round(S.w))); } catch (e) {} }
  function layout() {                                               // sidebar width + push the page aside when there is room
    var wd = clampW(S.w), on = S.open && !mobile() && S.mode === 'side', push = on && (window.innerWidth - wd >= 420);
    sb.style.setProperty('--sw', wd + 'px');
    document.body.style.transition = S.drag ? 'none' : 'margin-right .2s ease';
    document.body.style.marginRight = push ? wd + 'px' : '';
  }
  function fit() {                                                  // phones: keep the chat above the on-screen keyboard
    var vv = window.visualViewport;
    layout();
    if (!S.open || !mobile() || !vv) { sb.style.top = sb.style.height = sb.style.bottom = ''; return; }
    sb.style.top = vv.offsetTop + 'px'; sb.style.height = vv.height + 'px'; sb.style.bottom = 'auto';
    var b = $('bdy'); if (b) b.scrollTop = b.scrollHeight;
  }
  rz.addEventListener('pointerdown', function (e) {
    if (mobile() || S.mode !== 'side') return; S.drag = true; sb.classList.add('dr'); try { rz.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); layout();
  });
  rz.addEventListener('pointermove', function (e) { if (!S.drag) return; S.w = clampW(window.innerWidth - e.clientX); layout(); });
  function endDrag() { if (!S.drag) return; S.drag = false; sb.classList.remove('dr'); S.w = clampW(S.w); saveW(); layout(); }
  rz.addEventListener('pointerup', endDrag); rz.addEventListener('pointercancel', endDrag);
  rz.addEventListener('dblclick', function () { S.w = DEFW; saveW(); layout(); });
  rz.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowLeft' ? 24 : e.key === 'ArrowRight' ? -24 : 0; if (!d) return;
    e.preventDefault(); S.w = clampW(S.w + d); saveW(); layout();
  });
  async function showPanel() {
    if (S.open) return;
    S.mode = 'modal'; w.classList.remove('side');                      // always opens as the small chat window first
    S.open = true; w.classList.add('open'); document.title = t('doc'); badge();
    if (mobile()) document.documentElement.style.overflow = 'hidden';
    fit();
    if (!S.session) { viewOnboard(); return; }
    viewChat();
    try { await listen(); markRead(); } catch (e) { console.warn(e); }
  }
  function hidePanel() {
    if (!S.open) return;
    S.open = false; S.mode = 'modal'; w.classList.remove('open', 'side'); document.title = TITLE0; badge();
    document.documentElement.style.overflow = ''; fit();
    try { lc.focus({ preventScroll: true }); } catch (e) {}
  }
  function openChat() {                                             // user tapped the icon
    if (!isChatPath() && canHistory()) { try { history.pushState({ rgceChat: 1 }, '', CHAT_URL); S.pushed = true; } catch (e) {} }
    showPanel();
  }
  function closeChat() {                                            // user closed it
    if (S.pushed && canHistory()) { S.pushed = false; history.back(); return; }   // popstate hides the panel
    if (isChatPath() && canHistory()) { try { history.replaceState(null, '', BASE); } catch (e) {} }
    hidePanel();
  }
  window.addEventListener('popstate', function () {
    if (isChatPath()) { S.pushed = !!(history.state && history.state.rgceChat); showPanel(); } else { S.pushed = false; hidePanel(); }
  });
  lc.addEventListener('click', openChat);
  pn.addEventListener('click', function (e) { var n = e.target; while (n && n !== pn) { if (n.hasAttribute && n.hasAttribute('data-m')) { setMode(S.mode === 'side' ? 'modal' : 'side'); return; } if (n.hasAttribute && n.hasAttribute('data-x')) { closeChat(); return; } n = n.parentNode; } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.open) closeChat(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) markRead(); });
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
  window.addEventListener('resize', fit);

  function init() {
    document.body.appendChild(host); badge();
    if (S.session) listen().catch(function (e) { console.warn(e); });   // so the unread badge works while the panel is closed
    var viaRedirect = false; try { viaRedirect = sessionStorage.getItem(FLAG) === ROUTE; sessionStorage.removeItem(FLAG); } catch (e) {}
    if (viaRedirect && !isChatPath() && canHistory()) { try { history.replaceState(null, '', CHAT_URL); } catch (e) {} }   // 404.html sent us here: show the clean address
    if (isChatPath()) showPanel();
  }
  if (document.body) init(); else document.addEventListener('DOMContentLoaded', init);
  window.rgceChatRefreshLang = function () {
    badge(); if (S.open) { document.title = t('doc'); if (S.view === 'chat') viewChat(); else if (S.view === 'onboard') viewOnboard(); else if (S.view === 'ended') viewEnded(); }
  };
})();
</script>
